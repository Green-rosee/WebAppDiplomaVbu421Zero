services:

  postgres:
    image: postgres:17-alpine
    container_name: webapp-postgres

    environment:
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp_password
      POSTGRES_DB: webapp

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webapp -d webapp" ]
      interval: 5s
      timeout: 5s
      retries: 10


  webapp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: webappestimate-container

    ports:
      - "8080:8080"

    environment:

      ASPNETCORE_URLS: http://+:8080

      DatabaseProvider: Postgres

      ConnectionStrings__dbSiteBaseConnection: >
        Host=postgres;
        Port=5432;
        Database=webapp_base;
        Username=webapp;
        Password=webapp_password

      ConnectionStrings__dbSiteAdamConnection: >
        Host=postgres;
        Port=5432;
        Database=webapp_adam;
        Username=webapp;
        Password=webapp_password

      ConnectionStrings__dbSiteBramConnection: >
        Host=postgres;
        Port=5432;
        Database=webapp_bram;
        Username=webapp;
        Password=webapp_password

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: